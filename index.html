<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="description" content="Territory Intelligence Pro — Enterprise Territory & Route Management System" />
  <title>Territory Intelligence Pro</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <link rel="stylesheet" href="./src/css/main.css" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <div id="app" class="app-shell">

    <!-- HEADER -->
    <header id="app-header" class="app-header" role="banner">
      <button id="menu-toggle" class="icon-btn" aria-label="Buka menu" type="button">
        <span class="icon-menu" aria-hidden="true">☰</span>
      </button>
      <h1 id="app-title" class="app-title">Territory Intelligence Pro</h1>
      <button id="theme-toggle" class="icon-btn" aria-label="Ubah tema" type="button">
        <span class="icon-theme" aria-hidden="true">◐</span>
      </button>
    </header>

    <!-- MAIN CONTENT -->
    <main id="app-main" class="app-main" role="main" aria-live="polite">
      <!-- Rendered by Router -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav id="bottom-nav" class="bottom-nav" role="navigation" aria-label="Navigasi utama">
      <a href="#/dashboard" data-nav="dashboard" class="nav-item" aria-label="Home">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span class="nav-label">Home</span>
      </a>
      <a href="#/map" data-nav="map" class="nav-item" aria-label="Map">
        <span class="nav-icon" aria-hidden="true">◉</span>
        <span class="nav-label">Map</span>
      </a>
      <a href="#/territory" data-nav="territory" class="nav-item" aria-label="Territory">
        <span class="nav-icon" aria-hidden="true">⬡</span>
        <span class="nav-label">Territory</span>
      </a>
      <a href="#/routes" data-nav="routes" class="nav-item" aria-label="Routes">
        <span class="nav-icon" aria-hidden="true">↝</span>
        <span class="nav-label">Routes</span>
      </a>
      <a href="#/analytics" data-nav="analytics" class="nav-item" aria-label="Analytics">
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span class="nav-label">Analytics</span>
      </a>
    </nav>

    <!-- SIDE MENU (Drawer) -->
    <aside id="side-menu" class="side-menu" aria-hidden="true" role="dialog" aria-label="Menu tambahan">
      <div class="side-menu-header">
        <h2>Menu</h2>
        <button id="side-menu-close" class="icon-btn" aria-label="Tutup menu" type="button">✕</button>
      </div>
      <ul class="side-menu-list">
        <li><a href="#/data-import" data-nav="data-import">Data Import</a></li>
        <li><a href="#/outlet" data-nav="outlet">Outlet Management</a></li>
        <li><a href="#/salesman" data-nav="salesman">Salesman Management</a></li>
        <li><a href="#/reports" data-nav="reports">Reports</a></li>
        <li><a href="#/settings" data-nav="settings">Settings</a></li>
      </ul>
    </aside>
    <div id="side-menu-backdrop" class="side-menu-backdrop" hidden></div>

    <!-- FLOATING ACTION BUTTON -->
    <button id="fab" class="fab" aria-label="Aksi cepat" type="button" hidden>+</button>

    <!-- TOAST -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
      <div class="spinner" role="status" aria-label="Memuat"></div>
    </div>
  </div>

  <noscript>Territory Intelligence Pro membutuhkan JavaScript untuk berjalan.</noscript>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
